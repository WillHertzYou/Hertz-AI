name: Build Hertz APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner already has the Android SDK; just make sure Android 16 is there.
      - name: Install Android 16 SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # The signing key lives in the repo's secrets (Settings > Secrets and variables > Actions),
      # never in the code, so nobody else can sign an APK that installs over Hertz.
      - name: Get the signing key
        env:
          HERTZ_KEYSTORE_B64: ${{ secrets.HERTZ_KEYSTORE_B64 }}
        run: |
          if [ -z "$HERTZ_KEYSTORE_B64" ]; then
            echo "::error::The HERTZ_KEYSTORE_B64 secret is missing, so the APK couldn't install as an update."
            exit 1
          fi
          echo "$HERTZ_KEYSTORE_B64" | base64 -d > app/hertz.keystore

      - name: Get the on-device voice library
        run: |
          mkdir -p app/libs
          curl -sSL --fail -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          ls -lh app/libs

      - name: Build APK
        env:
          HERTZ_KEYSTORE_PASSWORD: ${{ secrets.HERTZ_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hertz.apk

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Hertz-apk
          path: Hertz.apk

      # Start a fresh "latest" release each time, so its date and commit match the APK inside it.
      - name: Remove the previous "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Publish as "latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hertz (latest build)
          prerelease: true
          files: Hertz.apk
          body: "Hertz built from ${{ github.sha }}. On your phone: tap Hertz.apk to download, then open it to install."
